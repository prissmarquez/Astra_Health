<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensors - Astra Health</title>
  <!-- Same styles as the dashboard (header, cards, nav) -->
  <link rel="stylesheet" href="../style/styles.css">
  <!-- Styles only for this page -->
  <link rel="stylesheet" href="../style/sensors.css">
  <!-- Session guard: redirect to the login if there is no session -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../services/supabase_client.js"></script>
  <script src="../services/auth_guard.js"></script>
  <script src="../services/nav.js"></script>
</head>
<body>
  <div class="sensors-page">

    <!-- HEADER (same as dashboard) -->
    <header class="card header">
      <img src="../assets/log_nasa.png" alt="NASA" class="logo-nasa">
      <img src="../assets/profile.png" alt="Profile picture" class="foto-perfil">

      <div class="usuario">
        <strong id="nombre-usuario">Username</strong>
        <small id="rol-usuario">Role</small>
      </div>

      <div class="bloque alerta">
        <small> Next check-in in:</small>
        <strong id="cuenta" class="reloj">--:--:--</strong>
        <div class="barra rojo"><div id="barra-cuenta"></div></div>
      </div>

      <div class="conectado"><span class="punto"></span> Checking...</div>

      <!-- LOG OUT -->
      <button class="btn-borde btn-logout" id="logout-btn">Log out</button>
    </header>

    <!-- SENSORS -->
    <main class="card sensors">
      <div class="sensors-title">
        <span class="sensors-title-icon">📡</span>
        <div>
          <h3>Health Sensors</h3>
          <small>Connect your monitoring devices</small>
        </div>
      </div>

      <div class="sensors-grid">

        <!-- Heart rate -->
        <div class="sensor-card">
          <span class="sensor-icon icon-red">❤</span>
          <h4>Heart Rate (HR)</h4>
          <button class="sensor-btn" data-sensor="heart_rate">Send reading</button>
        </div>

        <!-- HRV -->
        <div class="sensor-card">
          <span class="sensor-icon icon-blue">📈</span>
          <h4>HRV <span class="soft">(Heart Rate Variability)</span></h4>
          <button class="sensor-btn" data-sensor="hrv">Send reading</button>
        </div>

        <!-- SpO2 -->
        <div class="sensor-card">
          <span class="sensor-icon icon-blue">💧</span>
          <h4>SpO₂ <span class="soft">(Pulse oximetry)</span></h4>
          <button class="sensor-btn" data-sensor="spo2">Send reading</button>
        </div>

        <!-- Temperature -->
        <div class="sensor-card">
          <span class="sensor-icon icon-purple">🌡</span>
          <h4>Body Temperature</h4>
          <button class="sensor-btn" data-sensor="temperature">Send reading</button>
        </div>

        <!-- Blood pressure -->
        <div class="sensor-card">
          <span class="sensor-icon icon-purple">🩺</span>
          <h4>Blood Pressure (BP)</h4>
          <button class="sensor-btn" data-sensor="blood_pressure">Send reading</button>
        </div>

        <!-- Glucose -->
        <div class="sensor-card">
          <span class="sensor-icon icon-red">🩸</span>
          <h4>Blood Glucose <span class="soft">(Continuous monitor)</span></h4>
          <button class="sensor-btn" data-sensor="glucose">Send reading</button>
        </div>

      </div>
    </main>


  </div>

  <script src="../services/ble_codec.js"></script>
  <script src="../services/sensors.js"></script>
</body>
</html>
