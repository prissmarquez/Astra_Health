<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra Health - Body AI</title>
  <link rel="stylesheet" href="../style/styles.css">
  <link rel="stylesheet" href="../style/BodyAi_style.css">
  <!-- Session: same order as checkin.html. auth_guard.js sends you to login without a session. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../services/supabase_client.js"></script>
  <script src="../services/auth_guard.js"></script>
  <script src="../services/nav.js"></script>
</head>
<body>
  <div class="body-page">

    <!-- HEADER -->
    <header class="card header">
      <img src="../assets/log_nasa.png" alt="NASA" class="logo-nasa">
      <img src="../assets/profile.png" alt="Profile picture" class="foto-perfil">
      <div class="usuario">
        <strong id="user-name">Username</strong>
        <small id="user-role">Role</small>
      </div>
      <div class="bloque alerta">
        <small>Next check-in in:</small>
        <strong id="cuenta" class="reloj">--:--:--</strong>
      </div>
      <div class="conectado"><span class="punto"></span> Checking...</div>

      <!-- LOG OUT -->
      <button class="btn-borde btn-logout" id="logout-btn">Log out</button>
    </header>

    <div class="body-layout">

      <!-- LEFT: BODY SYSTEMS -->
      <aside class="card systems">
        <h3>Body systems</h3>
        <div class="systems-list" id="systems-list">
          <button type="button" class="system-btn active" data-system="cardio"><span class="sys-ico">❤️</span><span>Cardiovascular system</span></button>
          <button type="button" class="system-btn" data-system="resp"><span class="sys-ico">🫁</span><span>Respiratory system</span></button>
          <button type="button" class="system-btn" data-system="digest"><span class="sys-ico">🍽️</span><span>Digestive system</span></button>
          <button type="button" class="system-btn" data-system="nerv"><span class="sys-ico">🧠</span><span>Nervous system</span></button>
          <button type="button" class="system-btn" data-system="immune"><span class="sys-ico">🛡️</span><span>Immune system</span></button>
          <button type="button" class="system-btn" data-system="thermo"><span class="sys-ico">🌡️</span><span>Thermoregulation</span></button>
        </div>
      </aside>

      <!-- RIGHT: AI ANALYSIS -->
      <section class="analysis">

        <div class="card ai-box">
          <div class="ai-head">
            <h3>✨ AI analysis</h3>
            <span class="updated" id="ai-updated">--</span>
          </div>
          <div class="ai-body">
            <div class="ai-avatar">🤖</div>
            <p class="ai-text" id="ai-summary">Select a body system to see the analysis.</p>
          </div>
        </div>

        <div class="card system-card" id="system-card">
          <div class="system-head">
            <h3 id="system-title">Cardiovascular system</h3>
            <span class="status-pill" id="system-status">--</span>
          </div>
          <div class="system-body">
            <div class="metric">
              <div class="metric-value"><span id="metric-value">--</span> <small id="metric-unit"></small></div>
              <div class="metric-trend" id="metric-trend"></div>
              <div class="metric-label" id="metric-label"></div>
            </div>
            <div class="spark" id="spark"></div>
            <p class="explanation" id="system-explanation"></p>
          </div>
        </div>

        <div class="card reco-card">
          <h3>💡 Recommendations</h3>
          <ul class="reco-list" id="reco-list"></ul>
        </div>

      </section>
    </div>

  </div>

  <script src="../services/script_BodyAi.js"></script>
</body>
</html>
